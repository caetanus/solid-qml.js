name: ci

# Release-plan M7: the ONE supported CI/reference environment for the 0.x preview
# (docs/RELEASE-PLAN.md) — Linux x86_64, glibc >= 2.34, pinned Qt 6.11.2 (official aqtinstall
# binaries), Node 26, meson >= 1.1.
#
# Why manylinux_2_34 (quay.io/pypa/manylinux_2_34_x86_64, AlmaLinux 9): Qt's own 6.11/6.12
# reference platforms are RHEL 9.x (glibc 2.34, GCC 11) — manylinux_2_34 matches that distro
# family exactly (same glibc) and ships a modern GCC (14.2.1 at the time this was pinned) on PATH
# with full C++20 support, so no devtoolset juggling is needed. It also ships Qt's official Linux
# x64 binaries' expected baseline (glibc 2.34) directly, instead of relying on a rolling-release
# snapshot staying in lockstep with Qt's own pin (see the superseded Arch-snapshot design this
# replaced, in git history — it needed a *manual* date-pin re-verification every time Qt or Arch
# moved). Qt itself is installed from aqtinstall's official binaries (not distro packages), which
# is also the only source that reliably ships the *private* Qt headers this project's engine and
# widgets need (QtQuickTemplates2/private, QtQuick/private, …) without a distro-specific split.
#
# scripts/clean-room-check.sh --manylinux runs this exact provider (dnf + aqtinstall + Node
# tarball) locally via podman, as the clean-machine proof for release-plan M6. Arch
# (scripts/clean-room-check.sh with no flag) remains the supported LOCAL dev-machine verification
# path documented in docs/getting-started.md; it is not run in CI anymore.
#
# Both the manylinux provider steps below and the Arch provider steps in clean-room-check.sh feed
# the SAME build/test/install/smoke steps, factored into scripts/ci-steps.sh, so the two provider
# paths can never drift apart on what they verify.

on:
  push:
    branches: [master, widgets]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned versions (release-plan M7) — keep these in sync with scripts/clean-room-check.sh
  # --manylinux and docs/getting-started.md.
  QT_VERSION: "6.11.2"
  QT_ARCH: linux_gcc_64
  # qtshadertools: the only non-essential aqt module this build needs. qtbase/qtdeclarative/qtsvg
  # are "essential" modules aqtinstall always includes; qtshadertools ships `qsb` which this repo
  # does NOT invoke at build time (SolidTerm's shaders are pre-baked .qsb files checked into
  # apps/solidterm/shaders/ and bundled via a .qrc) but is kept here so a future shader rebuild
  # doesn't silently need a workflow change. qtgraphs/qtquick3d/qtwebengine/qtmultimedia are
  # feature-gated, lazily-imported QML modules (never linked by the C++ build, see
  # docs/getting-started.md "Optional, feature-gated") and are intentionally NOT installed here.
  QT_MODULES: qtshadertools
  NODE_VERSION: "26.8.2"
  NODE_SHA256: "40e1d3225c1c9ae9a2671c98ecb9857e4d5555026394f348645676798840d5c5"
  MESON_VERSION: "1.12.0"
  NINJA_VERSION: "1.13.0"
  AQTINSTALL_VERSION: "3.3.0"

jobs:
  linux:
    # This workflow is Linux-only (manylinux). macOS and Windows each get their own workflow file
    # (.github/workflows/macos.yml, windows.yml) and step scripts, owned separately — do not add
    # platform jobs here. The job id/name are deliberately platform-qualified so the three
    # workflows read unambiguously side by side in the Checks tab.
    name: linux (manylinux_2_34, Qt 6.11.2)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    timeout-minutes: 45
    env:
      # Never /tmp: this project's RAM-ceiling/tmpfs rule applies to CI's container disk too, and
      # keeps scratch files out of the runner's tmpfs.
      TMPDIR: ${{ github.workspace }}/.scratch/tmp
      CCACHE_DIR: ${{ github.workspace }}/.scratch/ccache
      QT_ROOT: /opt/qt
      PYCI_ROOT: /opt/pyci
      NODE_ROOT: /opt/node
      # Outside the checkout (release-plan M6 requirement) but inside the container's own
      # filesystem, never the runner's /tmp.
      SMOKE_DIR: /smoke-app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---- Provider step: manylinux_2_34 system dependencies (dnf) ------------------------------
      # Mirrors docs/getting-started.md's Arch dependency table, one package per same reason:
      # mesa/EGL (GPU/offscreen rendering), xkbcommon (keyboard), wayland(-protocols) (SolidTerm
      # background-blur extension — optional, this repo's wayland-protocols need is >= 1.45 but
      # manylinux_2_34/EPEL ships 1.37, so blur stays unavailable here same as a bare Arch image
      # without it; the build configures cleanly regardless), dbus (tray/notifications), fontconfig
      # /freetype/harfbuzz (text layout — Qt links these at runtime), libvterm (SolidTerm),
      # google-noto-sans-fonts (the sans-serif family the CSS engine's text-layout pixel-oracle test
      # is verified against — see docs/getting-started.md Troubleshooting), ccache (meson
      # auto-wraps the compiler with it when found on PATH).
      - name: System dependencies (dnf)
        run: |
          dnf -y -q install \
            mesa-libGL-devel mesa-libEGL-devel \
            libxkbcommon-devel libxkbcommon-x11-devel \
            wayland-devel wayland-protocols-devel \
            dbus-devel fontconfig-devel freetype-devel harfbuzz-devel \
            libvterm-devel \
            google-noto-sans-fonts google-noto-emoji-color-fonts \
            ccache

      # ---- Provider step: Node (official tarball, checksum-pinned) ------------------------------
      # manylinux_2_34's own `nodejs` dnf package is 16.x (EOL, far below this project's Node 26
      # baseline / vite@7's >=20.19 requirement) — the official tarball is the only pinned-version
      # source here, same rationale as Qt below.
      - name: "Node ${{ env.NODE_VERSION }} (official tarball, checksum-pinned)"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp-node.tar.xz \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  /tmp-node.tar.xz" | sha256sum -c -
          mkdir -p "$NODE_ROOT"
          tar -xJf /tmp-node.tar.xz -C "$NODE_ROOT" --strip-components=1
          rm -f /tmp-node.tar.xz
          echo "$NODE_ROOT/bin" >> "$GITHUB_PATH"

      # ---- Provider step: Python toolchain (meson/ninja/aqtinstall, pinned) ---------------------
      # manylinux's default `python3` is 3.9; python3.12 is one of the alternate interpreters this
      # image ships for building wheels against multiple ABIs — good enough to host a throwaway
      # venv for our own build tools.
      - name: Python toolchain (meson/ninja/aqtinstall, pinned)
        run: |
          python3.12 -m venv "$PYCI_ROOT"
          "$PYCI_ROOT/bin/pip" install --quiet \
            "meson==${MESON_VERSION}" "ninja==${NINJA_VERSION}" "aqtinstall==${AQTINSTALL_VERSION}"
          echo "$PYCI_ROOT/bin" >> "$GITHUB_PATH"

      # ---- Provider step: Qt (aqtinstall, official binaries, cached) ----------------------------
      - name: "Cache Qt ${{ env.QT_VERSION }}"
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-${{ env.QT_MODULES }}-v1

      - name: "Install Qt ${{ env.QT_VERSION }} (${{ env.QT_ARCH }})"
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          "$PYCI_ROOT/bin/aqt" install-qt linux desktop "$QT_VERSION" "$QT_ARCH" \
            -m $QT_MODULES --outputdir "$QT_ROOT"

      - name: Point the build at Qt
        run: |
          QT_PREFIX="$QT_ROOT/$QT_VERSION/gcc_64"
          echo "QT_PREFIX=$QT_PREFIX" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$QT_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$QT_PREFIX" >> "$GITHUB_ENV"
          # aqtinstall's Qt is self-contained, not registered with ldconfig the way a distro
          # package would be (unlike the Arch path this replaced) — the BUILD tree picks up an
          # rpath from meson's qt6 dependency and needs nothing extra, but ci-steps.sh's
          # step_smoke runs the *installed* solid-qml-loader (a plain `meson install --destdir`
          # copy with no rpath back to this Qt prefix) and needs Qt's lib dir on
          # LD_LIBRARY_PATH to find libQt6Core.so.6 etc. at runtime.
          echo "LD_LIBRARY_PATH=$QT_PREFIX/lib" >> "$GITHUB_ENV"
          echo "$QT_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Print pinned-environment versions
        run: |
          echo "-- OS --"; cat /etc/os-release
          echo "-- Qt --"; "$QT_PREFIX/bin/qmake6" -query QT_VERSION
          echo "-- Node --"; node --version
          echo "-- meson --"; meson --version
          echo "-- ninja --"; ninja --version
          echo "-- gcc --"; gcc --version | head -1

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-manylinux-env-${{ hashFiles('meson.build', 'vendor/qml-css-engine/meson.build') }}
          restore-keys: ccache-manylinux-env-

      # Invoked via `bash scripts/...` (not a bare `scripts/ci-steps.sh`) so a non-executable git
      # mode on the script can never turn into a CI failure again — belt-and-suspenders alongside
      # the executable bit tracked in git (see `git ls-files -s scripts/ci-steps.sh`).
      - name: Build + test + install + smoke-test
        run: bash scripts/ci-steps.sh
        env:
          # meson auto-detects and wraps the compiler with ccache when it is on PATH.
          JOBS: 4

      # actions/upload-artifact rejects any path containing a `..` segment, and ci-steps.sh's
      # smoke test deliberately runs OUTSIDE the checkout ($SMOKE_DIR, outside $GITHUB_WORKSPACE —
      # that is the release-plan M6 property being proven). Copy just the artifacts we want to
      # keep into the workspace first, then upload from there with plain relative paths.
      - name: Copy CI artifacts into the workspace
        if: always()
        run: |
          mkdir -p ci-artifacts
          cp build/meson-logs/testlog.txt ci-artifacts/ 2>/dev/null || true
          cp build/meson-logs/meson-log.txt ci-artifacts/ 2>/dev/null || true
          cp "$SMOKE_DIR/shot.png" ci-artifacts/smoke-shot.png 2>/dev/null || true

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-test-logs
          path: |
            ci-artifacts/testlog.txt
            ci-artifacts/meson-log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshot
          path: ci-artifacts/smoke-shot.png
          if-no-files-found: warn
          retention-days: 7
