name: ci

# Release-plan M7: the ONE supported environment for the 0.x preview (docs/RELEASE-PLAN.md) —
# Linux x86_64, Arch/Manjaro, pinned Qt 6.11.2, Node 26, meson >= 1.1. Arch is a rolling-release
# distro with no "frozen" release to pin to directly, so the toolchain comes from a date-pinned
# snapshot of the Arch Linux Archive (archive.archlinux.org) instead of the live mirrors — see
# the "Pin the toolchain" step below for exactly which date and why.
#
# Steps run INSIDE this job's container are factored into scripts/ci-steps.sh, shared with
# scripts/clean-room-check.sh (release-plan M6's clean-machine proof) so the two can't drift.

on:
  push:
    branches: [master, widgets]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-env:
    name: Pinned preview env (Arch, Qt 6.11.2)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    env:
      # Never /tmp: this project's RAM-ceiling/tmpfs rule applies to CI's container disk too, and
      # keeps scratch files out of the runner's tmpfs.
      TMPDIR: ${{ github.workspace }}/.scratch/tmp
      CCACHE_DIR: ${{ github.workspace }}/.scratch/ccache
    steps:
      # ---- Pin the toolchain (Arch Linux Archive snapshot) ----------------------------------
      # archlinux:latest's mirror is "whatever is current today" — rolling, unpinned, and
      # already ahead of the preview's pinned Qt 6.11.2 (the live repos moved to Qt 6.12.0 on
      # 2026-10-01). archive.archlinux.org keeps a full daily snapshot of every repo; 2026-09-15
      # is the latest date verified (by hand, see docs/RELEASE-PLAN.md M7 notes) to carry EXACTLY
      # qt6-base/qt6-declarative/qt6-svg 6.11.2, meson 1.12.0 and nodejs 26.8.2 — matching the
      # preview's pin on every axis. Pointing pacman at it instead of the rolling mirror, and
      # skipping `-u` (there is nothing to "upgrade" to inside a frozen snapshot), makes this job
      # reproducible across runs instead of silently drifting with Arch's next package bump.
      - name: Pin the toolchain to the Arch Linux Archive (2026-09-15, Qt 6.11.2)
        run: |
          echo 'Server = https://archive.archlinux.org/repos/2026/09/15/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Sy --noconfirm

      # ---- Dependency inventory (release-plan M6 §1 / docs/getting-started.md, mirrored here) --
      - name: Install dependencies
        run: |
          pacman -S --noconfirm --needed \
            base-devel git cmake meson ninja nodejs npm \
            qt6-base qt6-declarative qt6-svg \
            libvterm wayland-protocols \
            noto-fonts noto-fonts-emoji \
            ccache

      - name: Print pinned-environment versions
        run: |
          echo "-- OS --"; cat /etc/os-release
          echo "-- Qt (pacman) --"; pacman -Q qt6-base qt6-declarative qt6-svg
          echo "-- Node --"; node --version
          echo "-- meson --"; meson --version

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-pinned-env-${{ hashFiles('meson.build', 'vendor/qml-css-engine/meson.build') }}
          restore-keys: ccache-pinned-env-

      - name: Build + test + install + smoke-test
        run: scripts/ci-steps.sh
        env:
          # meson auto-detects and wraps the compiler with ccache when it is on PATH.
          JOBS: 4

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-test-logs
          path: |
            build/meson-logs/testlog.txt
            build/meson-logs/meson-log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshot
          # ci-steps.sh's smoke step authors + runs the tiny app in a directory NEXT TO the
          # checkout (never inside it, per the "outside the checkout" requirement) — one level up
          # from $GITHUB_WORKSPACE, which is this step's default working directory.
          path: ../solidqml-ci-smoke/shot.png
          if-no-files-found: ignore
          retention-days: 7
