<?xml version="1.0" encoding="UTF-8"?>
<!-- SolidTerm: a tiling terminal — one focused pane (prompt + block cursor, solid-qml green ring)
     beside two stacked splits. -->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4252"/>
      <stop offset="1" stop-color="#1b1f28"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141922"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- soft shadow -->
  <rect x="10" y="12" width="108" height="108" rx="24" fill="#000" opacity="0.18"/>
  <!-- body -->
  <rect x="8" y="8" width="112" height="110" rx="24" fill="url(#body)"/>
  <rect x="8.75" y="8.75" width="110.5" height="108.5" rx="23.25" fill="none" stroke="url(#glow)" stroke-width="1.5"/>

  <!-- panes -->
  <rect x="18" y="20" width="56" height="88" rx="9" fill="url(#pane)"/>
  <rect x="78" y="20" width="32" height="42" rx="8" fill="url(#pane)"/>
  <rect x="78" y="66" width="32" height="42" rx="8" fill="url(#pane)"/>
  <!-- focus ring on the main pane -->
  <rect x="18" y="20" width="56" height="88" rx="9" fill="none" stroke="#41cd52" stroke-width="2.5"/>

  <!-- main pane: prompt + block cursor, then output -->
  <path d="M27 33 l7 6 l-7 6" fill="none" stroke="#41cd52" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="39" y="33" width="8" height="13" rx="1.5" fill="#e9eef5"/>
  <g stroke-linecap="round" stroke-width="3.5">
    <line x1="27" y1="60" x2="62" y2="60" stroke="#6b7588"/>
    <line x1="27" y1="70" x2="50" y2="70" stroke="#6b7588"/>
    <line x1="27" y1="80" x2="58" y2="80" stroke="#4f9cf0"/>
    <line x1="27" y1="90" x2="44" y2="90" stroke="#6b7588"/>
  </g>

  <!-- side panes: dimmed output -->
  <g stroke-linecap="round" stroke-width="3" stroke="#4a5263">
    <line x1="85" y1="31" x2="102" y2="31"/>
    <line x1="85" y1="40" x2="96" y2="40"/>
    <line x1="85" y1="49" x2="100" y2="49"/>
    <line x1="85" y1="77" x2="99" y2="77"/>
    <line x1="85" y1="86" x2="103" y2="86"/>
    <line x1="85" y1="95" x2="93" y2="95"/>
  </g>
</svg>
