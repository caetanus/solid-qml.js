name: windows

# Windows x64 build: MSVC 2022 + Qt 6.11.2 (msvc2022_64) + Node 26 + meson/ninja. Builds, runs every
# test suite (transpiler + native), installs, windeployqt's the loader, runs an installed-artifact
# smoke test with a clean PATH, and uploads an UNSIGNED zip of the installed prefix + the smoke
# screenshot. Steps live in scripts/ci-windows.ps1 (the Windows counterpart of scripts/ci-steps.sh);
# what differs on Windows is documented in docs/windows.md.

on:
  push:
    branches: [master, widgets, ci-windows]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (MSVC 2022, Qt 6.11.2)
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      TMPDIR: ${{ github.workspace }}\.scratch\tmp
      JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.2'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install meson + ninja (pinned)
        run: python -m pip install meson==1.12.0 ninja==1.13.0

      # Not jurplel/install-qt-action: aqtinstall 3.3.0 (latest) predates the per-arch repository
      # layout Qt 6.11 uses. scripts/ci-windows.ps1 install-qt fetches the official archives itself
      # (SHA1-checked) into ../Qt, cached here.
      - name: Cache Qt 6.11.2 (msvc2022_64)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\Qt
          key: qt-6.11.2-msvc2022_64-base-declarative-svg-v1

      - name: Install Qt 6.11.2 (msvc2022_64)
        run: scripts/ci-windows.ps1 install-qt

      - name: MSVC 2022 x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Toolchain versions
        run: scripts/ci-windows.ps1 versions

      - name: npm ci + typecheck + transpiler tests
        run: scripts/ci-windows.ps1 npm-ci typecheck test-transpiler

      - name: Native build (meson + ninja)
        run: scripts/ci-windows.ps1 native-build

      - name: Native tests (offscreen)
        run: scripts/ci-windows.ps1 native-test

      - name: Install + windeployqt + smoke test + package
        run: scripts/ci-windows.ps1 install deploy smoke package

      - name: Upload unsigned Windows build
        uses: actions/upload-artifact@v4
        with:
          name: solid-qml-windows-x64-unsigned
          path: .scratch/dist/solid-qml-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-test-screenshot
          path: ../solidqml-ci-smoke/shot.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-meson-logs
          path: |
            build/meson-logs/testlog.txt
            build/meson-logs/meson-log.txt
          if-no-files-found: ignore
          retention-days: 7
